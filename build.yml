name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/jarvis/app app/src/main/res/mipmap-xxxhdpi app/src/main/assets
          mv app-build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/jarvis/app/
          mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ || true
          mv orb.html app/src/main/assets/ || true
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: app/build/outputs/apk/debug/*.apk
